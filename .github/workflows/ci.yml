name: fictional-checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: outreach_test
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: fictional-ci-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U outreach -d outreach_test" --health-interval 5s --health-retries 10
    env:
      OUTREACH_AUTO_ROLE_EXTRACTION: "false"
      TSENTA_POLL_ENABLED: "false"
      TEST_DATABASE_URL: postgresql+psycopg://outreach:fictional-ci-only@localhost:5432/outreach_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock.txt
      - run: .venv/bin/python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: .venv/bin/python -m evaluation.run --output /tmp/benchmark.mock.json
      - uses: actions/upload-artifact@v4
        with: {name: mock-harness-results, path: /tmp/benchmark.mock.json}
